name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-ui:
    name: Shell UI (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/shell/pnpm-lock.yaml
      - name: Install
        working-directory: apps/shell
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/shell
        run: pnpm build

  python:
    name: Python (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile
        run: python -m py_compile $(git ls-files '*.py')

  compose:
    name: Docker Compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
