name: Release desktop

# Tag a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) → CI builds the native c:node
# Shell installers on each OS and attaches them to a GitHub Release (draft, for review):
#   • macOS   → universal .dmg (Apple Silicon + Intel)
#   • Windows → .msi + .exe (NSIS)
#   • Linux   → .AppImage + .deb
# Tauri v2 app lives in apps/shell (frontend: pnpm + Vite; bundle.targets: all).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/shell/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri -> target

      - name: Linux build deps (Tauri v2 / WebKitGTK 4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libglib2.0-dev libgtk-3-dev build-essential curl wget file

      - name: Install frontend dependencies
        working-directory: apps/shell
        run: pnpm install --frozen-lockfile

      - name: Build + publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/shell
          tagName: ${{ github.ref_name }}
          releaseName: "c:node Shell ${{ github.ref_name }}"
          releaseBody: |
            Native desktop builds of the c:node Shell — chat + knowledge graph + agents, runs locally.

            ⚠️ Not yet code-signed:
            • macOS: right-click the app → **Open** on first launch (Gatekeeper).
            • Windows: SmartScreen → **More info** → **Run anyway**.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
