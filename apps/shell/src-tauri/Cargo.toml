[package]
name = "creativate-shell"
version = "0.1.0"
description = "Creativate Dev-Shell — NEN × cNode local demo"
authors = ["Creativate Technologies GmbH"]
edition = "2021"

[lib]
name = "creativate_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
